<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>OGI Fusion</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Fusiona exportaciones de OGame Infinity de uno o varios universos. Funciona 100% en local."
    />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Aplica el tema antes de que cargue Angular para evitar parpadeos.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('ogi-fusion-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Esta aplicación necesita JavaScript.</noscript>
  </body>
</html>
