name: Tests y despliegue

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Compilar para GitHub Pages
        run: |
          npx ng build --base-href "/${{ github.event.repository.name }}/"
          node scripts/spa-404.mjs dist/ogame-infinity-fusion/browser
          touch dist/ogame-infinity-fusion/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ogame-infinity-fusion/browser

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
